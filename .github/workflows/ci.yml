name: Spring Boot CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Permite ejecución manual

permissions:
  contents: read      # Mínimo privilegio de seguridad

jobs:
  snyk-scan:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    defaults:
      run:
        working-directory: ms-vehiculos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Fix mvnw permissions
        run: if [ -f mvnw ]; then chmod +x mvnw; fi

      - name: Resolve Maven dependencies
        run: mvn -B install -DskipTests

      - name: Snyk test Java dependencies
        run: |
          snyk test --severity-threshold=high \
            --file=pom.xml \
            --json-file-output=snyk-report.json -d

      - name: Upload Snyk JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-report
          path: ms-vehiculos/snyk-report.json
  
  test:
    name: Run Tests with JaCoCo
    runs-on: ubuntu-latest
    needs: snyk-scan
    defaults:
      run:
        working-directory: ms-vehiculos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      - name: Build and test
        run: mvn -B clean verify

      - name: Upload JaCoCo Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: ms-vehiculos/target/site/jacoco/

  build:
    name: Build Jar
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ms-vehiculos

    steps:
      # Paso 1: Checkout del repositorio
      - name: Checkout code
        uses: actions/checkout@v4

      # Paso 2: Configurar JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
          cache-dependency-path: ms-vehiculos/pom.xml

      # Paso 3: Construir el artefacto JAR
      - name: Package application
        run: mvn clean package -DskipTests

      # Paso 4: Subir artefacto JAR
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ms-vehiculos/target/*.jar